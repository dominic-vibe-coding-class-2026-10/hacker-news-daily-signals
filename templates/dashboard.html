<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacker News Daily Signals</title>
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #1c1915;
      --muted: #5e564c;
      --line: #ddcfc0;
      --accent: #c2410c;
      --pine: #1f4d3a;
      --card: #fffaf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 400px at 10% -10%, #ffe8d2 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    body[data-lang="zh"] { --accent: var(--pine); }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      max-width: 880px;
      margin: 0 auto;
      padding: 36px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      margin: 0 0 6px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 34px);
      font-weight: 600;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }
    .lede { margin: 8px 0 0; color: var(--muted); font-size: 17px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: flex-end;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      max-width: 880px;
      margin: 0 auto;
      padding: 16px 24px 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    .sources legend, .sources .source-label {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .source-checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .sources label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      letter-spacing: 0;
      color: var(--ink);
    }
    #apply {
      font: inherit;
      font-size: 14px;
      background: var(--ink);
      color: var(--paper);
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    label { display: grid; gap: 6px; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
    select {
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 160px;
    }
    .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .lang button {
      font: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    main { max-width: 880px; margin: 0 auto; padding: 8px 24px 64px; }
    .status {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--accent);
      min-height: 1.4em;
      margin: 18px 0;
    }
    .note { color: var(--muted); margin: 0 0 18px; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 16px;
      margin: 0 0 14px;
    }
    .meta {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    article h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; font-weight: 600; }
    article h2 a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    article p { margin: 0; font-size: 17px; line-height: 1.5; }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 28px 18px;
      color: var(--muted);
    }
    footer {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px 36px;
      color: var(--muted);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="mark" id="mark">Daily Signals</p>
      <h1 id="title">Hacker News Daily Signals</h1>
      <p class="lede" id="lede">Stories from the last 24 hours</p>
    </div>
    <div class="controls">
      <label id="date-label">Date
        <select id="date"></select>
      </label>
      <div>
        <div id="lang-label" style="font-size:12px;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;">Language</div>
        <div class="lang" role="group" aria-labelledby="lang-label">
          <button type="button" id="lang-en" aria-pressed="true">English</button>
          <button type="button" id="lang-zh" aria-pressed="false">繁體中文</button>
        </div>
      </div>
    </div>
  </header>
  <form class="sources" id="source-form">
    <div class="source-label" id="sources-label">Sources</div>
    <div class="source-checks" role="group" aria-labelledby="sources-label">
      <label><input type="checkbox" name="source" value="hket" checked> <span id="src-hket">HKET</span></label>
      <label><input type="checkbox" name="source" value="hn" checked> <span id="src-hn">Hacker News</span></label>
      <label><input type="checkbox" name="source" value="lobsters" checked> <span id="src-lobsters">Lobsters</span></label>
      <label><input type="checkbox" name="source" value="slashdot" checked> <span id="src-slashdot">Slashdot</span></label>
    </div>
    <button type="submit" id="apply">Apply</button>
  </form>
  <main>
    <p class="status" id="status"></p>
    <p class="note" id="note" hidden></p>
    <div id="list"></div>
  </main>
  <footer>
    <a id="report" href="#" hidden></a>
    <span id="foot"></span>
  </footer>
  <script>
    const copy = {
      en: {
        mark: "Daily Signals",
        title: "Hacker News Daily Signals",
        lede: "Stories from the last 24 hours",
        date: "Date",
        language: "Language",
        points: "Points",
        comments: "Comments",
        sources: "Sources",
        apply: "Apply",
        sourceNames: { hket: "HKET", hn: "Hacker News", lobsters: "Lobsters", slashdot: "Slashdot" },
        pick: "Select at least one source, then press Apply.",
        emptyFiltered: "No stories from the selected sources for this day.",
        empty: "No stories from the last 24 hours were on the front page for this day.",
        loading: "Loading the last 7 days of archive…",
        waiting: "Waiting for the first scrape to start…",
        report: "View Markdown",
        foot: "HKET tech, Hacker News, Lobsters, and Slashdot. Choose one source or all four, then press Apply.",
        uptodate: "Up to date",
      },
      zh: {
        mark: "每日訊號",
        title: "Hacker News 每日訊號",
        lede: "過去 24 小時的故事",
        date: "日期",
        language: "語言",
        points: "分數",
        comments: "留言",
        sources: "來源",
        apply: "套用",
        sourceNames: { hket: "HKET", hn: "Hacker News", lobsters: "Lobsters", slashdot: "Slashdot" },
        pick: "請至少選一個來源，然後按套用。",
        emptyFiltered: "選定的來源在這一天沒有故事。",
        empty: "這一天的首頁上，沒有 24 小時內的故事。",
        loading: "正在載入最近 7 天的資料…",
        waiting: "正在等待第一次抓取開始…",
        report: "查看 Markdown",
        foot: "來源為香港經濟日報科技版、Hacker News、Lobsters 與 Slashdot。可選一個或全選，然後按套用。",
        uptodate: "已是最新",
      },
    };

    const state = {
      lang: localStorage.getItem("hn-lang") === "zh" ? "zh" : "en",
      days: [],
      selected: "",
      running: false,
      message: "",
      preloadComplete: false,
      signature: "",
      sources: ["hket", "hn", "lobsters", "slashdot"],
    };

    const $ = (id) => document.getElementById(id);

    function applyLanguage() {
      const text = copy[state.lang];
      document.body.dataset.lang = state.lang;
      document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
      document.title = text.title;
      $("mark").textContent = text.mark;
      $("title").textContent = text.title;
      $("lede").textContent = text.lede;
      $("date-label").firstChild.textContent = text.date + " ";
      $("lang-label").textContent = text.language;
      $("lang-en").setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
      $("lang-zh").setAttribute("aria-pressed", state.lang === "zh" ? "true" : "false");
      $("report").textContent = text.report;
      $("foot").textContent = " " + text.foot;
      $("sources-label").textContent = text.sources;
      $("apply").textContent = text.apply;
      Object.entries(text.sourceNames).forEach(([id, label]) => {
        const node = $("src-" + id);
        if (node) node.textContent = label;
      });
      renderStatus();
    }

    const ALL_SOURCES = ["hket", "hn", "lobsters", "slashdot"];

    function savedSources() {
      try {
        const saved = JSON.parse(localStorage.getItem("hn-sources") || "null");
        if (!Array.isArray(saved)) return ALL_SOURCES.slice();
        const picked = saved.filter((id) => ALL_SOURCES.includes(id));
        if (picked.join(",") === "hn,lobsters,slashdot") return ["hket", ...picked];
        return picked;
      } catch (error) {
        return ALL_SOURCES.slice();
      }
    }

    function syncSourceChecks() {
      document.querySelectorAll("#source-form input[name=source]").forEach((input) => {
        input.checked = state.sources.includes(input.value);
      });
    }

    function statusText() {
      const text = copy[state.lang];
      const message = state.message || "";
      const scraping = message.match(/^Scraping (\d{4}-\d{2}-\d{2}) \((\d+)\/(\d+)\)$/);
      if (scraping && state.lang === "zh") {
        return `正在抓取 ${scraping[1]}（${scraping[2]}/${scraping[3]}）`;
      }
      if (message.startsWith("Scrape failed:") && state.lang === "zh") {
        return "抓取失敗：" + message.slice("Scrape failed:".length);
      }
      if (!message || message === "Up to date") return "";
      return message || (state.running ? text.loading : "");
    }

    function renderStatus() {
      const text = copy[state.lang];
      const message = statusText();
      if (state.running) {
        $("status").textContent = message || text.loading;
        return;
      }
      if (!state.days.length) {
        $("status").textContent = message || text.waiting;
        return;
      }
      $("status").textContent = message;
    }

    function fillDates() {
      const select = $("date");
      const current = state.selected;
      select.replaceChildren();
      state.days.forEach((day) => {
        const option = document.createElement("option");
        option.value = day.date;
        option.textContent = day.date;
        select.appendChild(option);
      });
      if (current && [...select.options].some((option) => option.value === current)) {
        select.value = current;
      } else if (select.options.length) {
        state.selected = select.options[0].value;
        select.value = state.selected;
      }
    }

    function renderStories(payload) {
      const text = copy[state.lang];
      const list = $("list");
      const stories = payload.stories || [];
      const day = payload.day;
      list.replaceChildren();
      const report = $("report");
      if (day) {
        report.hidden = false;
        report.href = "/reports/" + day.date;
      } else {
        report.hidden = true;
      }
      const note = $("note");
      if (day && day.note === "empty") {
        note.hidden = false;
        note.textContent = text.empty;
      } else if (day && day.note) {
        note.hidden = false;
        note.textContent = day.note;
      } else {
        note.hidden = true;
      }
      if (!stories.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = payload.needSource ? text.pick : text.emptyFiltered;
        list.appendChild(empty);
        return;
      }
      stories.forEach((story, index) => {
        const card = document.createElement("article");
        const meta = document.createElement("div");
        meta.className = "meta";
        const sourceName = text.sourceNames[story.source] || story.source || "";
        meta.textContent = `${index + 1}  ·  ${sourceName}  ·  ${text.points}: ${story.points}  ·  ${text.comments}: ${story.comments}`;
        const heading = document.createElement("h2");
        const link = document.createElement("a");
        link.href = story.external_url || story.hn_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = story.title;
        heading.appendChild(link);
        const summary = document.createElement("p");
        summary.textContent = state.lang === "zh" ? story.summary_zh : story.summary_en;
        card.append(meta, heading, summary);
        list.appendChild(card);
      });
    }

    async function loadStories() {
      if (!state.selected) {
        $("list").replaceChildren();
        return;
      }
      if (!state.sources.length) {
        renderStories({ stories: [], day: null, needSource: true });
        return;
      }
      const query = new URLSearchParams({
        date: state.selected,
        sources: state.sources.join(","),
      });
      const response = await fetch("/api/stories?" + query.toString());
      if (!response.ok) return;
      renderStories(await response.json());
    }

    async function refresh() {
      const response = await fetch("/api/status");
      if (!response.ok) return;
      const body = await response.json();
      const previous = state.selected;
      state.running = body.running;
      state.message = body.message || "";
      state.preloadComplete = body.preload_complete;
      state.days = body.days || [];
      if (!state.selected && state.days.length) state.selected = state.days[0].date;
      const signature = state.days
        .map((day) => day.date + ":" + day.story_count + ":" + day.scraped_at)
        .join("|");
      const changed = signature !== state.signature || previous !== state.selected;
      state.signature = signature;
      fillDates();
      renderStatus();
      if (changed) await loadStories();
    }

    $("lang-en").addEventListener("click", () => {
      state.lang = "en";
      localStorage.setItem("hn-lang", "en");
      applyLanguage();
      loadStories();
    });
    $("lang-zh").addEventListener("click", () => {
      state.lang = "zh";
      localStorage.setItem("hn-lang", "zh");
      applyLanguage();
      loadStories();
    });
    $("date").addEventListener("change", (event) => {
      state.selected = event.target.value;
      loadStories();
    });
    $("source-form").addEventListener("submit", (event) => {
      event.preventDefault();
      state.sources = [...document.querySelectorAll("#source-form input[name=source]:checked")].map((input) => input.value);
      localStorage.setItem("hn-sources", JSON.stringify(state.sources));
      loadStories();
    });

    state.sources = savedSources();
    syncSourceChecks();
    applyLanguage();
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
